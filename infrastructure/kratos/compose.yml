services:
  postgres:
    image: postgres:16
    container_name: mojaly-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mojaly_kratos}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-mojaly_kratos}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mojaly-auth-postgres-data:/var/lib/postgresql/data
    networks:
      - mojaly-auth

  kratos:
    image: ${KRATOS_IMAGE:-oryd/kratos:v1.2.0}
    container_name: mojaly-auth-kratos
    restart: unless-stopped
    environment:
      DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mojaly_kratos}?sslmode=disable&max_conns=20&max_idle_conns=4
      SECRETS_COOKIE_0: ${KRATOS_COOKIE_SECRET}
      SECRETS_CIPHER_0: ${KRATOS_CIPHER_SECRET}
      COURIER_SMTP_CONNECTION_URI: ${KRATOS_SMTP_CONNECTION_URI}
      SERVE_PUBLIC_BASE_URL: ${KRATOS_PUBLIC_URL}
      SERVE_ADMIN_BASE_URL: ${KRATOS_ADMIN_URL}
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: ${CONSOLE_URL}/
      SELFSERVICE_ALLOWED_RETURN_URLS_0: ${CONSOLE_URL}
      SELFSERVICE_METHODS_LINK_CONFIG_BASE_URL: ${KRATOS_PUBLIC_URL}
      SELFSERVICE_FLOWS_LOGIN_UI_URL: ${CONSOLE_URL}/auth/login
      SELFSERVICE_FLOWS_REGISTRATION_UI_URL: ${CONSOLE_URL}/auth/register
      SELFSERVICE_FLOWS_SETTINGS_UI_URL: ${CONSOLE_URL}/auth/settings
      SELFSERVICE_FLOWS_RECOVERY_UI_URL: ${CONSOLE_URL}/auth/recovery
      SELFSERVICE_FLOWS_VERIFICATION_UI_URL: ${CONSOLE_URL}/auth/verification
      SELFSERVICE_FLOWS_ERROR_UI_URL: ${CONSOLE_URL}/auth/error
      SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL: ${CONSOLE_URL}/auth/login
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${KRATOS_PUBLIC_PORT:-4433}:4433"
      - "${KRATOS_ADMIN_PORT:-4434}:4434"
    volumes:
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./kratos.yml:/etc/config/kratos/kratos.yml:ro
      - ./identity.schema.json:/etc/config/kratos/identity.schema.json:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - mojaly-auth

  mailslurper:
    image: oryd/mailslurper:latest-smtps
    container_name: mojaly-auth-mailslurper
    restart: unless-stopped
    ports:
      - "${MAILSLURPER_WEB_PORT:-4436}:4436"
      - "${MAILSLURPER_SMTP_PORT:-1025}:1025"
    networks:
      - mojaly-auth
networks:
  mojaly-auth:
    name: mojaly-auth

volumes:
  mojaly-auth-postgres-data:


