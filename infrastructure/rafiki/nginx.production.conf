server {
  listen 80;
  server_name pay.mojaly.com auth.mojaly.com admin.mojaly.com ilp.mojaly.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name pay.mojaly.com;

  ssl_certificate /etc/nginx/certs/mojaly.com.crt;
  ssl_certificate_key /etc/nginx/certs/mojaly.com.key;

  location /graphql {
    proxy_pass http://rafiki-backend:3001/graphql;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /rates {
    return 200 '{"base":"USD","rates":{"GBP":0.78,"UGX":3700,"KES":129,"USD":1}}';
    add_header Content-Type application/json;
  }

  location / {
    proxy_pass http://rafiki-backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

server {
