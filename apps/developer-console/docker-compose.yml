services:
  developer-console:
    image: ghcr.io/mojaly/developer-console:latest
    container_name: mojaly-developer-console
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped