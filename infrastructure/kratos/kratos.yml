version: v1.2.0

dsn: ""

serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:3000
        - http://localhost:5173
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
        - X-CSRF-Token
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://localhost:3000/
  allowed_return_urls:
    - http://localhost:3000

  methods:
    password:
      enabled: true
    link:
      enabled: true
      config:
        lifespan: 1h

  flows:
    login:
      lifespan: 10m
      ui_url: http://localhost:3000/auth/login

    registration:
      lifespan: 10m
      ui_url: http://localhost:3000/auth/register
      after:
        password:
          hooks:
            - hook: session

    settings:
      privileged_session_max_age: 15m
      required_aal: highest_available
      ui_url: http://localhost:3000/auth/settings

    recovery:
      enabled: true
      use: link
      ui_url: http://localhost:3000/auth/recovery
      after:
        hooks:
          - hook: revoke_active_sessions

    verification:
      enabled: true
      use: link
      ui_url: http://localhost:3000/auth/verification

    error:
      ui_url: http://localhost:3000/auth/error

    logout:
      after:
        default_browser_return_url: http://localhost:3000/auth/login

log:
  level: info
  format: json
  leak_sensitive_values: false

secrets:
  cookie:
    - PLEASE_REPLACE_WITH_ENV
  cipher:
    - PLEASE_REPLACE_WITH_ENV

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 10

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

session:
  lifespan: 24h
  cookie:
    persistent: true
    same_site: Lax
    path: /
