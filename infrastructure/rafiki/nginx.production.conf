  location /admin/graphql {
    proxy_pass http://rafiki-auth:3003/graphql;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    proxy_pass http://rafiki-auth:3006;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

server {
  listen 443 ssl;
  server_name admin.mojaly.com;

  ssl_certificate /etc/nginx/certs/mojaly.com.crt;
  ssl_certificate_key /etc/nginx/certs/mojaly.com.key;

